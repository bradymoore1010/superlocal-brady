name: Feature request
description: Propose a focused addition to Mail's native email workflow.
title: "[Request]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What email task is slow, unclear, or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful interaction, including keyboard behavior.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Performance, privacy, and scope tradeoffs
      description: Explain network, cache, OAuth, main-thread, or interface implications.
  - type: checkboxes
    id: fit
    attributes:
      label: Product fit
      options:
        - label: This stays within a native macOS email client and does not add calendar, task, or hosted-service scope.
          required: true
