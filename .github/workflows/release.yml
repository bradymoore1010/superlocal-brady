name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run deterministic tests
        run: ./scripts/test.sh

      - name: Package app
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME}"

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "release/Mail-macOS-${GITHUB_REF_NAME}.zip"
            "release/Mail-macOS-${GITHUB_REF_NAME}.zip.sha256"
            "docs/assets/mail-launch.mp4"
          )

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --generate-notes \
              --title "Mail ${GITHUB_REF_NAME}" \
              --verify-tag
          fi
