name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Scan public tree
        run: ./scripts/check-public-tree.sh

      - name: Run deterministic tests
        run: ./scripts/test.sh

      - name: Build release app
        run: ./scripts/build-app.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict Mail.app

  launch-film:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: launch-video
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launch-video/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        run: npm run lint
