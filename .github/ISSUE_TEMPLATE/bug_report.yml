name: Bug report
description: Report a reproducible problem using sanitized data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach credentials, real mail, a Gmail database, or a screenshot from a connected account.
  - type: input
    id: version
    attributes:
      label: Mail version
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.6 on MacBook Air M3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use fictional names, addresses, subjects, and message content.
      placeholder: |
        1. Open the fictional sample inbox.
        2. Press …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized diagnostics
      description: Paste only the smallest relevant log excerpt or a screenshot made with fictional data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed OAuth values, real mail, email addresses, local paths, databases, and private screenshots.
          required: true
