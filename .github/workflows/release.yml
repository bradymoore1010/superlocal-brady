name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run deterministic tests
        run: ./scripts/test.sh

      - name: Package app
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/Mail-macOS-${GITHUB_REF_NAME}.zip
          release/Mail-macOS-${GITHUB_REF_NAME}.zip.sha256
          docs/assets/mail-launch.mp4
          --generate-notes
          --title "Mail ${GITHUB_REF_NAME}"
          --verify-tag
