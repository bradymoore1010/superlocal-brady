name: Superlocal checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run typecheck && bun --no-env-file run build
      - run: bun --no-env-file run typecheck:host && bun --no-env-file run typecheck:mock
      - run: bun --no-env-file run build:web && bun --no-env-file run test:web
      - run: bun --no-env-file run test:api
        env:
          INBOX_TEST_LIVE: 'false'
      - name: Gmail provider checks
        run: bun --no-env-file test ./packages/inbox-sdk/tests/provider.test.ts --test-name-pattern 'gmail deterministic native peer'
        env:
          INBOX_TEST_LIVE: 'false'
      - run: bun --no-env-file run build:macos
