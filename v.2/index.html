<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail — Frosted glass prototype</title>
  <style>
    :root {
      color-scheme: light;
      --bg: oklch(0.4046 0.0697 179.60);
      --surface: oklch(0.9228 0.0291 163.20);
      --fg: oklch(0.1968 0.0121 155.94);
      --muted: oklch(0.1968 0.0121 155.94 / 0.68);
      --border: oklch(1 0 0 / 0.32);
      --accent: oklch(0.4409 0.0694 186.82);
      --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      --font-body: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      --font-mono: "SFMono-Regular", ui-monospace, Menlo, Monaco, Consolas, monospace;
      --ink-soft: oklch(0.1968 0.0121 155.94 / 0.50);
      --ink-faint: oklch(0.1968 0.0121 155.94 / 0.36);
      --ink-on-dark: oklch(0.984 0.006 157 / 0.98);
      --glass-window: rgba(213, 236, 224, 0.58);
      --glass-structure: rgba(211, 247, 239, 0.30);
      --glass-structure-bright: rgba(225, 255, 248, 0.38);
      --glass-nested: rgba(173, 205, 196, 0.36);
      --glass-nested-light: rgba(239, 250, 246, 0.58);
      --glass-selected: rgba(143, 184, 173, 0.44);
      --glass-control: rgba(246, 252, 248, 0.72);
      --glass-control-hover: rgba(255, 255, 255, 0.80);
      --glass-control-pressed: rgba(211, 229, 222, 0.72);
      --line-neutral: rgba(18, 55, 47, 0.11);
      --line-strong: rgba(18, 55, 47, 0.17);
      --focus-ring: rgba(17, 79, 67, 0.62);
      --dark-control: #17201C;
      --dark-hover: #202B26;
      --dark-pressed: #0E1512;
      --success: #1F7A50;
      --danger: #A13C32;
      --radius-window: 28px;
      --radius-region: 20px;
      --radius-card: 16px;
      --radius-control: 11px;
      --shadow-window: 0 28px 72px oklch(0.170 0.046 171 / 0.34), 0 6px 20px oklch(0.170 0.046 171 / 0.16);
      --shadow-float: 0 22px 60px oklch(0.150 0.050 171 / 0.28), 0 8px 24px oklch(0.170 0.046 171 / 0.16);
      --shadow-control: 0 2px 8px oklch(0.170 0.046 171 / 0.08);
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --sidebar: 236px;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 1120px; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: var(--font-body);
      color: var(--fg);
      font-size: 13px;
      line-height: 18px;
      letter-spacing: -0.15px;
      background: var(--bg);
    }
    button, input, textarea { font: inherit; letter-spacing: inherit; color: inherit; }
    button { border: 0; }
    button, [role="button"], .mail-row { -webkit-tap-highlight-color: transparent; }
    .lucide { width: 15px; height: 15px; display: block; stroke-width: 1.7; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, [role="button"]:focus-visible, [contenteditable="true"]:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-width: 1120px;
      min-height: 720px;
      overflow: hidden;
      background-color: var(--bg);
      background-image:
        radial-gradient(80% 120% at 56% 8%, rgba(218, 202, 126, 0.74), transparent 46%),
        radial-gradient(90% 90% at 10% 70%, rgba(12, 91, 79, 0.92), transparent 62%),
        radial-gradient(80% 100% at 95% 80%, rgba(3, 53, 48, 0.96), transparent 58%);
    }
    .desktop::before,
    .desktop::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(72px);
      opacity: .72;
      pointer-events: none;
    }
    .desktop::before {
      width: 46vw;
      height: 42vh;
      left: 31vw;
      top: -17vh;
      background: oklch(0.875 0.096 93 / 0.56);
      transform: rotate(-8deg);
    }
    .desktop::after {
      width: 36vw;
      height: 72vh;
      right: -14vw;
      bottom: -26vh;
      background: oklch(0.530 0.104 175 / 0.66);
      transform: rotate(14deg);
    }

    .mail-window {
      position: absolute;
      inset: 24px 28px;
      min-width: 1064px;
      min-height: 672px;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(244, 255, 249, 0.38);
      border-radius: var(--radius-window);
      background: var(--glass-window);
      box-shadow: var(--shadow-window), inset 0 1px 0 rgba(255, 255, 255, 0.32);
      backdrop-filter: blur(42px) saturate(115%);
      -webkit-backdrop-filter: blur(42px) saturate(115%);
    }
    .mail-window::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(66% 54% at 58% 0%, rgba(250, 242, 197, 0.26), transparent 72%);
      mix-blend-mode: soft-light;
    }

    .traffic { position: absolute; top: 14px; left: 14px; display: flex; gap: 8px; }
    .light { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px oklch(0.18 0.02 170 / .18), 0 1px 1px oklch(1 0 0 / .32); }
    .light.red { background: oklch(0.673 0.213 27); }
    .light.yellow { background: oklch(0.838 0.171 86); }
    .light.green { background: oklch(0.675 0.168 145); }
    .workspace { position: relative; z-index: 2; display: grid; grid-template-columns: var(--sidebar) 1fr; height: 100%; min-height: 0; }
    .sidebar {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      padding: 44px 12px 14px;
      border-right: 1px solid oklch(0.300 0.030 166 / 0.10);
      background: oklch(0.765 0.040 174 / 0.18);
      box-shadow: inset -1px 0 0 oklch(1 0 0 / 0.15), inset 0 1px 0 oklch(1 0 0 / 0.18);
      backdrop-filter: blur(28px) saturate(110%);
      -webkit-backdrop-filter: blur(28px) saturate(110%);
    }
    .nav-group { display: grid; gap: 2px; }
    .nav-group + .nav-group { margin-top: 16px; }
    .nav-label { min-height: 24px; display: flex; align-items: center; padding: 0 10px; color: var(--ink-soft); font-size: 12px; line-height: 16px; }
    .nav-row {
      width: 100%;
      height: 36px;
      display: grid;
      grid-template-columns: 16px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--fg);
      text-align: left;
      cursor: pointer;
      transition: background 90ms var(--ease), border-color 90ms var(--ease), color 90ms var(--ease);
    }
    .nav-row:hover { color: var(--fg); background: oklch(0.972 0.018 165 / 0.26); }
    .nav-row:active { background: var(--glass-control-pressed); }
    .nav-row.active {
      color: var(--fg);
      font-weight: 550;
      border-color: oklch(1 0 0 / 0.25);
      background: var(--glass-selected);
      box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.27), 0 0 0 .5px var(--line-neutral);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .nav-row[data-mailbox="Inbox"] .lucide { width: 12px; height: 12px; fill: currentColor; }
    .nav-icon { width: 16px; display: grid; place-items: center; }
    .nav-icon .lucide { width: 14px; height: 14px; }
    .nav-count { min-width: 18px; color: var(--ink-soft); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
    .sidebar-spacer { flex: 1; }
    .sidebar-bottom { display: grid; gap: 8px; padding: 0 6px; }
    .sidebar-status {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      height: 28px;
      padding: 0 6px;
      border-radius: 8px;
      background: transparent;
      color: var(--ink-soft);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }
    .sidebar-status:hover { color: var(--fg); background: oklch(0.972 0.018 165 / 0.26); }
    .sidebar-status .lucide { flex: 0 0 auto; width: 12px; height: 12px; }
    .account-label { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .sidebar-divider { height: 1px; background: var(--line-neutral); }
    .command-trigger { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 24px; padding: 0; border-radius: 8px; background: transparent; color: var(--fg); cursor: pointer; }
    .command-trigger:hover { color: var(--fg); background: oklch(0.972 0.018 165 / 0.26); }

    .main { min-width: 0; min-height: 0; display: grid; grid-template-rows: 76px minmax(0, 1fr) 44px; background: var(--glass-structure); backdrop-filter: blur(28px) saturate(106%); -webkit-backdrop-filter: blur(28px) saturate(106%); }
    .main.inbox-mode { padding-left: 48px; }
    .main.reader-mode { grid-template-rows: 76px minmax(0, 1fr); }
    .main.reader-mode .keyboard-footer { display: none; }
    .main-header { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 20px; border-bottom: 1px solid oklch(1 0 0 / 0.16); box-shadow: inset 0 1px 0 oklch(1 0 0 / .12); }
    .header-title-wrap { display: flex; min-width: 0; align-items: baseline; gap: 8px; }
    .page-title { margin: 0; font-family: var(--font-display); font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.35px; }
    .page-count { color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .control {
      min-width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid oklch(1 0 0 / 0.42);
      border-radius: var(--radius-control);
      background: var(--glass-control);
      box-shadow: var(--shadow-control), 0 0 0 .5px var(--line-neutral), inset 0 1px 0 oklch(1 0 0 / .28);
      backdrop-filter: blur(14px) saturate(110%);
      -webkit-backdrop-filter: blur(14px) saturate(110%);
      color: var(--fg);
      font-size: 13px;
      line-height: 16px;
      font-weight: 550;
      white-space: nowrap;
      cursor: pointer;
      transition: background 90ms var(--ease), transform 90ms var(--ease), border-color 90ms var(--ease);
    }
    .control:hover { background: var(--glass-control-hover); border-color: oklch(1 0 0 / .56); }
    .control:active { background: var(--glass-control-pressed); transform: scale(.985); }
    .control.primary { border-color: oklch(1 0 0 / .08); background: var(--dark-control); color: var(--ink-on-dark); box-shadow: 0 4px 12px oklch(0.170 0.046 171 / .18), inset 0 1px 0 oklch(1 0 0 / .12); }
    .control.primary:hover { background: var(--dark-hover); color: var(--ink-on-dark); }
    .control.primary:active { background: var(--dark-pressed); }
    .control[disabled] { opacity: .42; cursor: default; box-shadow: none; transform: none; }
    .key { display: inline-flex; min-width: 20px; height: 20px; align-items: center; justify-content: center; padding: 0 6px; border: 1px solid var(--line-neutral); border-radius: 6px; background: oklch(0.985 0.008 159 / .54); color: var(--muted); font-family: var(--font-body); font-size: 12px; line-height: 18px; letter-spacing: 0; box-shadow: inset 0 1px 0 oklch(1 0 0 / .28); }
    .primary .key { height: auto; min-width: 0; padding: 0; border: 0; background: transparent; color: oklch(0.984 0.006 157 / .72); box-shadow: none; }

    .search-wrap { position: relative; height: 36px; width: 0; overflow: hidden; opacity: 0; transition: width 140ms var(--ease), opacity 90ms var(--ease); }
    .search-wrap.open { width: 248px; opacity: 1; overflow: visible; }
    .search-input { width: 100%; height: 36px; padding: 0 64px 0 34px; border: 1px solid oklch(1 0 0 / .44); border-radius: 12px; background: var(--glass-control); box-shadow: var(--shadow-control), 0 0 0 .5px var(--line-neutral), inset 0 1px 0 oklch(1 0 0 / .30); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); outline: none; }
    .search-icon { position: absolute; left: 12px; top: 9px; color: var(--ink-soft); pointer-events: none; }
    .search-close { position: absolute; right: 2px; top: 2px; width: 32px; height: 32px; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
    .search-close:hover { background: oklch(1 0 0 / .36); color: var(--fg); }

    .view { position: relative; min-height: 0; overflow: hidden; }
    .inbox-list { height: 100%; overflow: auto; scrollbar-width: none; }
    .inbox-list::-webkit-scrollbar { width: 0; height: 0; }
    .mail-row {
      position: relative;
      width: 100%;
      height: 64px;
      display: grid;
      grid-template-columns: 6px 164px max-content minmax(0, 1fr) 64px;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      border: 1px solid transparent;
      border-bottom-color: var(--line-neutral);
      border-radius: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 90ms var(--ease), border-color 90ms var(--ease), border-radius 90ms var(--ease);
    }
    .mail-row:hover { border-color: oklch(1 0 0 / .18); border-radius: 11px; background: var(--glass-structure-bright); }
    .mail-row.selected { border-color: oklch(1 0 0 / .26); border-radius: 11px; background: var(--glass-selected); box-shadow: inset 0 1px 0 oklch(1 0 0 / .24), 0 0 0 .5px var(--line-neutral); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .unread-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dark-control); }
    .read .unread-dot { visibility: hidden; }
    .sender { overflow: hidden; font-weight: 450; white-space: nowrap; text-overflow: ellipsis; }
    .unread .sender, .unread .subject { font-weight: 550; }
    .subject, .preview { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .subject { max-width: 340px; color: var(--fg); font-weight: 450; }
    .preview { color: var(--muted); }
    .timestamp { color: var(--ink-soft); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .empty-state { height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 13px; }

    .reader-header-left { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .icon-button { width: 32px; height: 32px; padding: 0; }
    .subject-stack { min-width: 0; }
    .subject-line { overflow: hidden; color: var(--fg); font-size: 14px; line-height: 19px; font-weight: 550; white-space: nowrap; text-overflow: ellipsis; }
    .sender-line { overflow: hidden; color: var(--ink-soft); font-size: 12px; line-height: 16px; white-space: nowrap; text-overflow: ellipsis; }
    .reader { height: 100%; overflow: auto; padding: 16px 48px 20px; scrollbar-width: none; }
    .reader::-webkit-scrollbar { width: 0; height: 0; }
    .conversation { width: min(960px, 100%); min-height: 100%; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    .message-card { flex: 0 0 52px; display: grid; grid-template-columns: 140px 1fr 92px; align-items: center; gap: 12px; padding: 0 16px; border: 1px solid var(--line-neutral); border-radius: 14px; background: oklch(0.925 0.024 165 / .34); box-shadow: inset 0 1px 0 oklch(1 0 0 / .24); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: var(--muted); }
    .message-card strong { color: var(--fg); font-weight: 550; }
    .message-card .summary { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .message-card time { color: var(--ink-soft); font-size: 12px; text-align: right; }
    .message-card.expanded { flex: 1 1 150px; min-height: 136px; display: block; padding: 18px 20px; border-radius: var(--radius-card); background: var(--glass-nested-light); box-shadow: inset 0 1px 0 oklch(1 0 0 / .34), 0 8px 24px oklch(0.170 0.046 171 / .08); }
    .message-meta { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .message-meta strong { display: block; color: var(--fg); font-size: 13px; font-weight: 550; }
    .message-meta span, .message-meta time { display: block; color: var(--ink-soft); font-size: 12px; line-height: 16px; }
    .message-copy { max-width: 720px; margin-top: 12px; color: var(--fg); font-size: 13px; line-height: 18px; }
    .message-copy p { margin: 0 0 12px; }

    .reply-composer { flex: 0 0 202px; min-height: 202px; display: grid; grid-template-rows: 42px 1fr 44px; border: 1px solid var(--line-neutral); border-radius: var(--radius-card); overflow: hidden; background: var(--glass-nested-light); box-shadow: inset 0 1px 0 oklch(1 0 0 / .36), 0 8px 28px oklch(0.170 0.046 171 / .09); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: flex-basis 140ms var(--ease); }
    .reply-composer.has-tools { flex-basis: 236px; }
    .reply-label { display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--line-neutral); color: var(--muted); font-size: 12px; }
    .reply-body { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .reply-field { min-height: 84px; flex: 1; overflow: auto; padding: 14px 16px; border: 0; background: transparent; outline: 0; color: var(--fg); font-size: 13px; line-height: 18px; }
    .reply-field:empty::before { content: attr(data-placeholder); color: var(--ink-faint); pointer-events: none; }
    .format-toolbar { height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line-neutral); }
    .format-toolbar[hidden] { display: none; }
    .format-action { width: 32px; height: 32px; border-radius: 8px; background: transparent; font-size: 12px; font-weight: 550; }
    .format-action:hover { background: var(--glass-control-hover); }
    .attachment-strip { display: flex; min-height: 0; align-items: center; padding: 0 12px; }
    .attachment-strip:not(:empty) { min-height: 32px; }
    .attachment-chip { display: inline-flex; height: 28px; max-width: 300px; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid var(--line-neutral); border-radius: 8px; background: rgba(248, 252, 249, 0.54); color: var(--muted); font-size: 12px; }
    .attachment-chip span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .attachment-remove { width: 32px; height: 32px; margin: -2px -8px -2px 0; border-radius: 7px; background: transparent; color: var(--muted); }
    .attachment-remove:hover { color: var(--fg); background: var(--glass-control-hover); }
    .composer-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 8px 0 12px; }
    .composer-tools, .composer-send { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .tool-button { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
    .tool-button:hover { color: var(--fg); background: oklch(1 0 0 / .34); }
    .tool-button[aria-pressed="true"] { color: var(--fg); background: var(--glass-selected); }
    .reply-composer .control, .modal .control { backdrop-filter: none; -webkit-backdrop-filter: none; }
    .autosave { overflow: hidden; color: var(--ink-soft); font-size: 12px; white-space: nowrap; text-overflow: ellipsis; }
    .send-hint { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }

    .keyboard-footer { display: flex; align-items: center; justify-content: center; gap: 12px; border-top: 1px solid var(--line-neutral); background: oklch(0.9228 0.0291 163.20 / .10); color: var(--ink-soft); font-size: 12px; }
    .hint { display: inline-flex; align-items: center; gap: 4px; }

    .popover { position: absolute; z-index: 30; top: 60px; right: 20px; width: 204px; padding: 8px; border: 1px solid oklch(1 0 0 / .44); border-radius: 14px; background: oklch(0.965 0.020 164 / .76); box-shadow: var(--shadow-float), inset 0 1px 0 oklch(1 0 0 / .34); backdrop-filter: blur(14px) saturate(110%); -webkit-backdrop-filter: blur(14px) saturate(110%); transform-origin: top right; animation: pop 120ms var(--ease); }
    .popover[hidden] { display: none; }
    .popover button { width: 100%; height: 36px; padding: 0 10px; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
    .popover button:hover { background: var(--glass-selected); }
    .popover .danger { color: var(--danger); }

    .scrim { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 32px; background: oklch(0.135 0.041 171 / .18); animation: fade 120ms var(--ease); }
    .scrim[hidden] { display: none; }
    .modal { border: 1px solid oklch(1 0 0 / .46); border-radius: 18px; background: oklch(0.950 0.025 164 / .80); box-shadow: 0 30px 80px oklch(0.120 0.050 171 / .34), inset 0 1px 0 oklch(1 0 0 / .42); backdrop-filter: blur(36px) saturate(112%); -webkit-backdrop-filter: blur(36px) saturate(112%); animation: modal-in 120ms var(--ease); overflow: hidden; }
    .command-modal { width: 560px; max-width: calc(100vw - 64px); padding: 10px; }
    .command-search { width: 100%; height: 48px; padding: 0 12px 0 34px; border: 0; border-bottom: 1px solid var(--line-neutral); background: transparent; outline: 0; }
    .command-search-wrap { position: relative; }
    .command-search-wrap .search-icon { top: 15px; left: 12px; }
    .command-section-label { min-height: 28px; display: flex; align-items: flex-end; padding: 0 8px; color: var(--ink-soft); font-size: 12px; }
    .command-results { height: 332px; overflow: auto; scrollbar-width: none; }
    .command-results::-webkit-scrollbar { width: 0; height: 0; }
    .command-row { width: 100%; height: 48px; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
    .command-icon { display: grid; place-items: center; }
    .command-icon .lucide { width: 15px; height: 15px; }
    .command-row:hover { background: var(--glass-selected); }
    .command-row.selected { background: var(--dark-control); color: var(--ink-on-dark); }
    .command-row.selected .command-description { color: oklch(0.984 0.006 157 / .70); }
    .command-row.selected .key { color: var(--ink-on-dark); border-color: oklch(1 0 0 / .18); background: oklch(1 0 0 / .08); }
    .command-title { display: block; font-weight: 550; line-height: 16px; }
    .command-description { display: block; color: var(--muted); font-size: 12px; line-height: 16px; }
    .command-footer { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-top: 1px solid var(--line-neutral); color: var(--ink-soft); font-size: 12px; }

    .compose-modal { width: 640px; height: 500px; max-width: calc(100vw - 64px); max-height: calc(100vh - 64px); display: grid; grid-template-rows: 52px 44px 44px minmax(0, 1fr) 52px; }
    .compose-titlebar { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line-neutral); }
    .compose-titlebar h2 { margin: 0; font-size: 14px; line-height: 19px; font-weight: 550; }
    .compose-close { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
    .compose-close:hover { color: var(--fg); background: oklch(1 0 0 / .30); }
    .compose-row { display: grid; grid-template-columns: 54px 1fr; align-items: center; min-height: 0; padding: 0 16px; border-bottom: 1px solid var(--line-neutral); }
    .recipient-row { position: relative; z-index: 4; }
    .compose-row label { color: var(--ink-soft); font-size: 12px; }
    .compose-row input { width: 100%; height: 43px; border: 0; background: transparent; outline: 0; }
    .recipient-suggestions {
      position: absolute;
      top: 40px;
      right: 10px;
      left: 68px;
      z-index: 8;
      padding: 5px;
      border: 1px solid oklch(1 0 0 / .48);
      border-radius: 12px;
      background: oklch(0.965 0.020 164 / .91);
      box-shadow: var(--shadow-float), inset 0 1px 0 oklch(1 0 0 / .38);
      backdrop-filter: blur(28px) saturate(112%);
      -webkit-backdrop-filter: blur(28px) saturate(112%);
    }
    .recipient-suggestions[hidden] { display: none; }
    .recipient-option {
      width: 100%;
      height: 46px;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .recipient-option:hover, .recipient-option.selected { background: var(--glass-selected); }
    .recipient-avatar { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid oklch(1 0 0 / .34); border-radius: 50%; background: var(--glass-nested); color: var(--muted); font-size: 11px; font-weight: 550; }
    .recipient-name, .recipient-email { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .recipient-name { color: var(--fg); font-weight: 550; line-height: 16px; }
    .recipient-email, .recipient-status { color: var(--ink-soft); font-size: 12px; line-height: 16px; }
    .recipient-status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .compose-body { width: 100%; min-height: 0; overflow: auto; padding: 16px; border: 0; background: transparent; outline: 0; line-height: 18px; }
    .compose-body:empty::before { content: attr(data-placeholder); color: var(--ink-faint); pointer-events: none; }
    .compose-footer { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 12px; border-top: 1px solid var(--line-neutral); }

    .toast { position: absolute; z-index: 60; left: 50%; bottom: 56px; min-height: 36px; display: flex; align-items: center; padding: 0 14px; border: 1px solid oklch(1 0 0 / .22); border-radius: 11px; background: var(--dark-control); color: var(--ink-on-dark); box-shadow: 0 12px 32px oklch(0.150 0.050 171 / .24); transform: translateX(-50%); animation: toast-in 140ms var(--ease); font-size: 12px; }
    .toast[hidden] { display: none; }

    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: scale(1); } }
    @keyframes modal-in { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: scale(1); } }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 4px); } to { opacity: 1; transform: translate(-50%, 0); } }

    @media (max-width: 1279px) { .search-wrap.open { width: 220px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
    @media (prefers-contrast: more), (prefers-reduced-transparency: reduce) {
      .mail-window { background: oklch(0.9228 0.0291 163.20 / .94); }
      .sidebar, .main { background: oklch(0.9228 0.0291 163.20 / .88); }
      .control, .reply-composer, .message-card, .modal, .popover { background: oklch(0.975 0.014 162 / .97); }
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .mail-window { background: #8DBEAC; }
      .sidebar, .main { background: #A4DAD4; }
      .reply-composer, .message-card, .modal, .popover { background: #BBE3D1; }
    }
  </style>
</head>
<body>
  <main class="desktop" data-od-id="desktop-ambience">
    <section class="mail-window" data-od-id="mail-window" aria-label="Mail desktop application">
      <div class="workspace" data-od-id="mail-workspace">
        <aside class="sidebar" data-od-id="mail-sidebar">
          <div class="traffic" aria-hidden="true">
            <span class="light red"></span><span class="light yellow"></span><span class="light green"></span>
          </div>
          <nav class="nav-group" aria-label="Mailboxes" data-od-id="mailbox-navigation">
            <button class="nav-row active" data-mailbox="Inbox" data-od-id="nav-inbox"><span class="nav-icon"><i data-lucide="circle" aria-hidden="true"></i></span><span>Inbox</span><span class="nav-count" id="inboxCount">3</span></button>
            <button class="nav-row" data-mailbox="Starred" data-od-id="nav-starred"><span class="nav-icon"><i data-lucide="star" aria-hidden="true"></i></span><span>Starred</span><span class="nav-count"></span></button>
            <button class="nav-row" data-mailbox="Sent" data-od-id="nav-sent"><span class="nav-icon"><i data-lucide="arrow-up-right" aria-hidden="true"></i></span><span>Sent</span><span class="nav-count"></span></button>
            <button class="nav-row" data-mailbox="Drafts" data-od-id="nav-drafts"><span class="nav-icon"><i data-lucide="square" aria-hidden="true"></i></span><span>Drafts</span><span class="nav-count">1</span></button>
            <button class="nav-row" data-mailbox="Archive" data-od-id="nav-archive"><span class="nav-icon"><i data-lucide="arrow-down" aria-hidden="true"></i></span><span>Archive</span><span class="nav-count"></span></button>
          </nav>
          <nav class="nav-group" aria-label="Labels" data-od-id="label-navigation">
            <div class="nav-label">Labels</div>
            <button class="nav-row" data-mailbox="Updates" data-od-id="nav-updates"><span class="nav-icon"><i data-lucide="diamond" aria-hidden="true"></i></span><span>Updates</span><span class="nav-count"></span></button>
            <button class="nav-row" data-mailbox="Receipts" data-od-id="nav-receipts"><span class="nav-icon"><i data-lucide="circle" aria-hidden="true"></i></span><span>Receipts</span><span class="nav-count"></span></button>
          </nav>
          <div class="sidebar-spacer"></div>
          <div class="sidebar-bottom">
            <button class="sidebar-status" data-od-id="gmail-connection-status"><i data-lucide="circle-check" aria-hidden="true"></i><span class="account-label">you@example.com</span></button>
            <div class="sidebar-divider" aria-hidden="true"></div>
            <button class="command-trigger" id="commandTrigger" data-od-id="command-menu-trigger"><span>Command menu</span><span class="key">⌘ K</span></button>
          </div>
        </aside>

        <section class="main" data-od-id="mail-main-region">
          <header class="main-header" id="mainHeader" data-od-id="mail-main-header"></header>
          <section class="view" id="view" data-od-id="mail-primary-view"></section>
          <footer class="keyboard-footer" id="keyboardFooter" data-od-id="keyboard-shortcut-footer"></footer>
        </section>
      </div>

      <div class="scrim" id="commandScrim" data-od-id="command-menu-overlay" hidden>
        <section class="modal command-modal" role="dialog" aria-modal="true" aria-labelledby="commandTitle" data-od-id="command-menu">
          <div class="command-search-wrap">
            <i data-lucide="search" class="search-icon" aria-hidden="true"></i>
            <input class="command-search" id="commandSearch" aria-label="Search commands" placeholder="Search mail or run a command…" autocomplete="off">
          </div>
          <div class="command-section-label" id="commandTitle">Actions</div>
          <div class="command-results" id="commandResults"></div>
          <footer class="command-footer"><span><span class="key">↑</span> <span class="key">↓</span> Select &nbsp; <span class="key">↵</span> Run</span><span><span class="key">Esc</span> Close</span></footer>
        </section>
      </div>

      <div class="scrim" id="composeScrim" data-od-id="compose-overlay" hidden>
        <section class="modal compose-modal" role="dialog" aria-modal="true" aria-labelledby="composeTitle" data-od-id="compose-window">
          <header class="compose-titlebar"><h2 id="composeTitle" data-od-id="compose-heading">New message</h2><button class="compose-close" id="composeClose" aria-label="Close compose"><i data-lucide="x" aria-hidden="true"></i></button></header>
          <div class="compose-row recipient-row"><label for="composeTo">To</label><input id="composeTo" autocomplete="off" aria-label="Recipients" aria-autocomplete="list" aria-controls="recipientSuggestions" placeholder="name@example.com" data-od-id="compose-recipient"><div class="recipient-suggestions" id="recipientSuggestions" role="listbox" aria-label="Suggested recipients" hidden></div></div>
          <div class="compose-row"><label for="composeSubject">Subject</label><input id="composeSubject" autocomplete="off" aria-label="Subject" data-od-id="compose-subject"></div>
          <div class="compose-body" id="composeBody" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message" data-placeholder="Write a message…" data-od-id="compose-editor"></div>
          <footer class="compose-footer">
            <div class="composer-tools"><button class="tool-button" id="composeAttach" aria-label="Add attachment" title="Add attachment"><i data-lucide="paperclip" aria-hidden="true"></i></button><button class="tool-button" id="composeFormat" aria-label="Formatting" title="Formatting">Aa</button><span class="autosave" id="composeAttachmentState">Draft saved automatically</span></div>
            <button class="control primary" id="composeSend" data-od-id="compose-send-button" disabled><span class="key">⌘↵</span><span>Send</span></button>
          </footer>
          <input id="composeFile" type="file" multiple hidden>
        </section>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite" data-od-id="status-toast" hidden></div>
    </section>
  </main>

  <script src="vendor/lucide.min.js"></script>
  <script>
    (() => {

          body: ["Everything is ready for Thursday. I added the final notes and moved the open questions to the top so we can make the decisions quickly.", "No need to prepare anything else. See you then."],

        {

          ]
        },
        { id: "studio-supply", sender: "Studio Supply", email: "hello@studiosupply.example", subject: "September receipt", preview: "Your receipt for order 2187 is attached.", time: "Yesterday", unread: false, starred: false, label: "Receipts", hasCorrespondence: false, body: ["Thanks for your order. Your September receipt for order 2187 is ready.", "Keep this email for your records."] },
        {
          id: "jules-park", sender: "Jules Park", email: "jules@paper.example", subject: "Re: Product notes", preview: "The keyboard flow feels right. One thought on the reply field…", time: "Yesterday", unread: false, starred: true, label: "Updates", hasCorrespondence: true,

        },
        { id: "nimbus", sender: "Nimbus", email: "security@nimbus.example", subject: "Security sign-in", preview: "A new sign-in was approved from your Mac.", time: "Mon", unread: false, starred: false, label: "Updates", hasCorrespondence: false, body: ["A new sign-in was approved from your Mac on Monday.", "If this was not you, review your account activity."] },
        { id: "paper", sender: "Paper", email: "team@paper.example", subject: "Welcome to your workspace", preview: "Your first collaborative canvas is ready.", time: "Mon", unread: false, starred: false, label: "Updates", hasCorrespondence: false, body: ["Your first collaborative canvas is ready.", "Invite teammates whenever you are ready to begin."] },
        { id: "atlas-health", sender: "Atlas Health", email: "benefits@atlas.example", subject: "Updated policy", preview: "The latest coverage summary is ready to review.", time: "Fri", unread: false, starred: false, label: "Updates", hasCorrespondence: false, body: ["The latest coverage summary is ready to review.", "No action is required unless your contact information has changed."] },
        { id: "rina", sender: "Rina", email: "rina@example.com", subject: "Introduction", preview: "I thought the two of you should meet.", time: "Fri", unread: false, starred: false, label: "", hasCorrespondence: false, body: ["I thought the two of you should meet. You are both working on thoughtful desktop products.", "I will leave it to you from here."] },
        { id: "studio-notes", sender: "Studio Notes", email: "updates@studio.example", subject: "Weekly digest", preview: "Five notes were added to your shared project.", time: "Thu", unread: false, starred: false, label: "Updates", hasCorrespondence: false, body: ["Five notes were added to your shared project this week.", "Open the project when you are ready to review them."] }
      ];
      const sentMessages = [
        { id: "sent-ava", sender: "Ava Patel", email: "ava@northwind.example", subject: "Re: Project handoff", preview: "Thursday works. I will review the final notes before then.", time: "Yesterday", unread: false, hasCorrespondence: true, body: ["Thursday works. I will review the final notes before then."] },
        { id: "sent-theo", sender: "Theo Martin", email: "theo@studio.example", subject: "Re: Coffee next week", preview: "Tuesday at 9 is perfect.", time: "Mon", unread: false, hasCorrespondence: true, body: ["Tuesday at 9 is perfect. See you downtown."] }
      ];
      const draftMessages = [{ id: "draft-followup", sender: "Ava Patel", email: "ava@northwind.example", subject: "Follow-up notes", preview: "Three decisions from today and the owners for each…", time: "Draft", unread: false, hasCorrespondence: true, body: ["Three decisions from today and the owners for each…"] }];
      const archivedMessages = [];
      const recipientDirectory = [
        { name: "Ava Patel", email: "ava@northwind.example", previouslyEmailed: true },
        { name: "Theo Martin", email: "theo@studio.example", previouslyEmailed: true },
        { name: "Jules Park", email: "jules@paper.example", previouslyEmailed: true },
        { name: "Rina", email: "rina@example.com", previouslyEmailed: false },
        { name: "Northwind Orders", email: "orders@northwind.example", previouslyEmailed: false },
        { name: "Studio Supply", email: "hello@studiosupply.example", previouslyEmailed: false }
      ];
      const state = { mailbox: "Inbox", view: "inbox", selected: 0, query: "", searchOpen: false, activeMessage: messages[0], replyOpen: true, replyAttachments: [], composeAttachments: [], recipientSelection: 0 };
      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => [...document.querySelectorAll(selector)];
      const main = $(".main");
      const mainHeader = $("#mainHeader");
      const view = $("#view");
      const keyboardFooter = $("#keyboardFooter");
      const toast = $("#toast");
      let toastTimer;

      const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
      const keyChip = (key) => `<span class="key">${key}</span>`;
      const icon = (name) => `<i data-lucide="${name}" aria-hidden="true"></i>`;
      const hydrateIcons = () => window.lucide?.createIcons();
      const inboxHints = () => `<span class="hint">${keyChip("J")} ${keyChip("K")} Move</span><span class="hint">${keyChip("↵")} Open</span><span class="hint">${keyChip("E")} Archive</span><span class="hint">${keyChip("R")} Reply</span>`;
      const readerHints = () => state.replyOpen
        ? `<span class="hint">${keyChip("⌫")} Back</span><span class="hint">${keyChip("E")} Archive</span><span class="hint">${keyChip("R")} Reply</span><span class="hint">${keyChip("⌘↵")} Send</span>`
        : `<span class="hint">${keyChip("⌫")} Back</span><span class="hint">${keyChip("E")} Archive</span><span class="hint">${keyChip("R")} Open reply</span>`;

      function visibleMessages() {
        let source = messages;
        if (state.mailbox === "Starred") source = messages.filter((message) => message.starred);
        if (state.mailbox === "Sent") source = sentMessages;
        if (state.mailbox === "Drafts") source = draftMessages;
        if (state.mailbox === "Archive") source = archivedMessages;
        if (state.mailbox === "Updates") source = messages.filter((message) => message.label === "Updates");
        if (state.mailbox === "Receipts") source = messages.filter((message) => message.label === "Receipts");
        const query = state.query.trim().toLowerCase();
        return source.filter((message) => !query || `${message.sender} ${message.subject} ${message.preview}`.toLowerCase().includes(query));
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.hidden = false;
        toastTimer = window.setTimeout(() => { toast.hidden = true; }, 1800);
      }

      function updateNavigation() {
        $$(".nav-row").forEach((row) => {
          const active = row.dataset.mailbox === state.mailbox;
          row.classList.toggle("active", active);
          if (active) row.setAttribute("aria-current", "page"); else row.removeAttribute("aria-current");
        });
        $("#inboxCount").textContent = messages.filter((message) => message.unread).length;
      }

      function chooseMailbox(mailbox) {
        state.mailbox = mailbox;
        state.view = "inbox";
        state.query = "";
        state.searchOpen = false;
        state.selected = 0;
        updateNavigation();
        render();
      }

      function selectedMessage() {
        return state.view === "reader" ? state.activeMessage : visibleMessages()[state.selected];
      }

      function toggleStar() {
        const message = selectedMessage();
        if (!message) return;
        message.starred = !message.starred;
        const starAction = $("#morePopover [data-more='star']");
        if (starAction) starAction.textContent = message.starred ? "Remove star" : "Add star";
        showToast(message.starred ? "Star added" : "Star removed");
        if (state.view === "inbox") renderInbox();
      }

      function toggleRead() {
        const message = selectedMessage();
        if (!message) return;
        message.unread = !message.unread;
        updateNavigation();
        showToast(message.unread ? "Marked as unread" : "Marked as read");
        if (state.view === "inbox") renderInbox();
      }

      function searchMarkup() {
        if (!state.searchOpen && !state.query) return "";
        return `<div class="search-wrap open" id="searchWrap">${icon("search").replace("aria-hidden", "class=\"search-icon\" aria-hidden")}<input class="search-input" id="searchInput" aria-label="Search mail" placeholder="Search mail" value="${escapeHtml(state.query)}"><button class="search-close" id="searchClose" aria-label="Close search">${icon("x")}</button></div>`;
      }

      function renderInbox() {
        const items = visibleMessages();
        if (state.selected >= items.length) state.selected = Math.max(0, items.length - 1);
        main.classList.add("inbox-mode");
        main.classList.remove("reader-mode");
        const unread = items.filter((message) => message.unread).length;
        const countCopy = state.query
          ? `${items.length} result${items.length === 1 ? "" : "s"}`
          : state.mailbox === "Inbox"
            ? `${unread} unread`
            : `${items.length} conversation${items.length === 1 ? "" : "s"}`;
        mainHeader.innerHTML = `<div class="header-title-wrap"><h1 class="page-title" data-od-id="mailbox-heading">${escapeHtml(state.mailbox)}</h1><span class="page-count">${countCopy}</span></div><div class="header-actions">${searchMarkup()}<button class="control primary" id="composeButton" data-od-id="compose-button"><span>Draft</span><span class="key">C</span></button></div>`;
        view.innerHTML = items.length ? `<div class="inbox-list" role="listbox" aria-label="Messages">${items.map((message, index) => `<button class="mail-row ${message.unread ? "unread" : "read"}${index === state.selected ? " selected" : ""}" role="option" aria-selected="${index === state.selected}" data-index="${index}" data-id="${message.id}" data-od-id="message-row-${message.id}"><span class="unread-dot"></span><span class="sender">${escapeHtml(message.sender)}</span><span class="subject">${escapeHtml(message.subject)}</span><span class="preview">${escapeHtml(message.preview)}</span><time class="timestamp">${escapeHtml(message.time)}</time></button>`).join("")}</div>` : `<div class="empty-state" data-od-id="mailbox-empty-state">${state.query ? "No messages match this search." : `No messages in ${escapeHtml(state.mailbox)}.`}</div>`;
        keyboardFooter.innerHTML = inboxHints();
        bindInbox();
        hydrateIcons();
      }

      function renderReader() {
        const message = state.activeMessage || messages[0];
        main.classList.remove("inbox-mode");
        main.classList.add("reader-mode");
        const body = message.body || [message.preview];
        const replyAction = `<button class="control" id="replyButton" data-od-id="open-reply-button">Reply <span class="key">R</span></button>`;
        const history = (message.history || []).map((item, index) => `<article class="message-card" data-od-id="message-card-history-${index}"><strong>${escapeHtml(item.author)}</strong><span class="summary">${escapeHtml(item.summary)}</span><time>${escapeHtml(item.time)}</time></article>`).join("");
        const composer = state.replyOpen ? `<section class="reply-composer" id="replyComposer" data-od-id="reply-composer"><div class="reply-label">Reply to ${escapeHtml(message.sender)}</div><div class="reply-body"><div class="format-toolbar" id="formatToolbar" data-od-id="reply-formatting-toolbar" hidden><button class="format-action" data-format="bold" aria-label="Bold" title="Bold">B</button><button class="format-action" data-format="italic" aria-label="Italic" title="Italic"><em>I</em></button><button class="format-action" data-format="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list">•</button></div><div class="reply-field" id="replyField" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Reply" data-placeholder="Write a reply…"></div><div class="attachment-strip" id="attachmentStrip" data-od-id="reply-attachments"></div><input id="replyFile" type="file" multiple hidden></div><footer class="composer-footer"><div class="composer-tools"><button class="tool-button" id="attachmentButton" aria-label="Add attachment" title="Add attachment">${icon("paperclip")}</button><button class="tool-button" id="formatButton" aria-label="Formatting" title="Formatting" aria-expanded="false">Aa</button><span class="autosave" id="autosaveStatus">Draft saved automatically</span></div><div class="composer-send"><span class="send-hint">⌘↵ Send</span><button class="control primary" id="replySend" data-od-id="reply-send-button" disabled>Send</button></div></footer></section>` : "";
        mainHeader.innerHTML = `<div class="reader-header-left"><button class="control icon-button" id="backButton" aria-label="Back to inbox" title="Back to inbox" data-od-id="back-to-inbox">${icon("chevron-left")}</button><div class="subject-stack"><div class="subject-line" data-od-id="conversation-heading">${escapeHtml(message.subject)}</div><div class="sender-line">${escapeHtml(message.sender)} · ${escapeHtml(message.email || "mail@example.com")}</div></div></div><div class="header-actions">${replyAction}<button class="control" id="archiveButton" data-od-id="archive-button">Archive <span class="key">E</span></button><button class="control" id="moreButton" aria-expanded="false" data-od-id="more-button">More ${icon("ellipsis")}</button></div><div class="popover" id="morePopover" role="menu" data-od-id="more-menu" hidden><button role="menuitem" data-more="unread">Mark as unread</button><button role="menuitem" data-more="star">${message.starred ? "Remove star" : "Add star"}</button><button role="menuitem" data-more="archive">Move to Archive</button></div>`;
        view.innerHTML = `<div class="reader" data-od-id="conversation-reader"><div class="conversation">${history}<article class="message-card expanded" data-od-id="message-card-latest"><div class="message-meta"><div><strong>${escapeHtml(message.sender)}</strong><span>to me</span></div><time>Today, ${escapeHtml(message.time)}</time></div><div class="message-copy">${body.map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join("")}</div></article>${composer}</div></div>`;
        keyboardFooter.innerHTML = readerHints();
        bindReader();
        hydrateIcons();
        if (state.replyOpen) requestAnimationFrame(() => { const reader = $(".reader"); reader.scrollTop = reader.scrollHeight; });
      }

      function render() { state.view === "reader" ? renderReader() : renderInbox(); }

      function openMessage(index) {
        const items = visibleMessages();
        if (!items[index]) return;
        state.selected = index;
        state.activeMessage = items[index];
        state.activeMessage.unread = false;
        state.replyOpen = Boolean(state.activeMessage.hasCorrespondence);
        state.replyAttachments = [];
        state.view = "reader";
        updateNavigation();
        render();
      }

      function archiveCurrent() {
        const message = selectedMessage();
        if (!message || state.mailbox === "Archive") return;
        if (!archivedMessages.some((item) => item.id === message.id)) archivedMessages.unshift(message);
        [messages, sentMessages, draftMessages].forEach((source) => {
          const index = source.findIndex((item) => item.id === message.id);
          if (index >= 0) source.splice(index, 1);
        });
        state.mailbox = "Inbox";
        state.view = "inbox";
        state.query = "";
        state.searchOpen = false;
        state.selected = Math.min(state.selected, Math.max(0, messages.length - 1));
        updateNavigation();
        render();
        showToast(`${message.subject} archived`);
      }

      function openSearch() {
        state.view = "inbox";
        state.searchOpen = true;
        render();
        requestAnimationFrame(() => $("#searchInput")?.focus());
      }

      function bindInbox() {
        $$(".mail-row").forEach((row) => row.addEventListener("click", () => openMessage(Number(row.dataset.index))));
        $("#composeButton").addEventListener("click", openCompose);
        const input = $("#searchInput");
        if (!input) return;
        input.addEventListener("input", (event) => { state.query = event.target.value; state.searchOpen = true; renderInbox(); requestAnimationFrame(() => { $("#searchInput")?.focus(); $("#searchInput")?.setSelectionRange(state.query.length, state.query.length); }); });
        $("#searchClose").addEventListener("click", () => { state.query = ""; state.searchOpen = false; renderInbox(); });
      }

      function bindReader() {
        $("#backButton").addEventListener("click", () => { state.view = "inbox"; render(); });
        $("#replyButton")?.addEventListener("click", focusReply);
        $("#archiveButton").addEventListener("click", archiveCurrent);
        $("#moreButton").addEventListener("click", () => { const popover = $("#morePopover"); popover.hidden = !popover.hidden; $("#moreButton").setAttribute("aria-expanded", String(!popover.hidden)); });
        $$("#morePopover button").forEach((button) => button.addEventListener("click", () => {
          $("#morePopover").hidden = true;
          if (button.dataset.more === "unread") { state.activeMessage.unread = true; updateNavigation(); showToast("Marked as unread"); }
          if (button.dataset.more === "star") toggleStar();
          if (button.dataset.more === "archive") archiveCurrent();
        }));
        const reply = $("#replyField");
        if (!reply) return;
        const send = $("#replySend");
        let saveTimer;
        reply.addEventListener("input", () => {
          const hasText = Boolean(reply.innerText.trim());
          send.disabled = !hasText;
          $("#autosaveStatus").textContent = hasText ? "Saving draft…" : "Draft saved automatically";
          window.clearTimeout(saveTimer);
          saveTimer = window.setTimeout(() => { if ($("#autosaveStatus")) $("#autosaveStatus").textContent = "Draft saved automatically"; }, 500);
        });
        send.addEventListener("click", sendReply);
        const toolbar = $("#formatToolbar");
        const composer = $("#replyComposer");
        const attachmentStrip = $("#attachmentStrip");
        const syncTools = () => composer.classList.toggle("has-tools", !toolbar.hidden || state.replyAttachments.length > 0);
        const renderAttachments = () => {
          attachmentStrip.innerHTML = state.replyAttachments.map((file, index) => `<span class="attachment-chip"><span>${escapeHtml(file.name)} · ${file.size < 1024 ? `${file.size} bytes` : `${Math.round(file.size / 1024)} KB`}</span><button class="attachment-remove" data-remove="${index}" aria-label="Remove ${escapeHtml(file.name)}" title="Remove attachment">${icon("x")}</button></span>`).join("");
          attachmentStrip.querySelectorAll("[data-remove]").forEach((button) => button.addEventListener("click", () => { state.replyAttachments.splice(Number(button.dataset.remove), 1); renderAttachments(); }));
          syncTools();
          hydrateIcons();
        };
        $("#formatButton").addEventListener("click", () => { toolbar.hidden = !toolbar.hidden; $("#formatButton").setAttribute("aria-expanded", String(!toolbar.hidden)); syncTools(); reply.focus(); });
        toolbar.querySelectorAll("[data-format]").forEach((button) => button.addEventListener("mousedown", (event) => { event.preventDefault(); document.execCommand(button.dataset.format, false); reply.focus(); }));
        $("#attachmentButton").addEventListener("click", () => $("#replyFile").click());
        $("#replyFile").addEventListener("change", (event) => { state.replyAttachments.push(...Array.from(event.target.files)); event.target.value = ""; renderAttachments(); showToast("Attachment added"); });
      }

      function sendReply() {
        const reply = $("#replyField");
        const text = reply?.innerText.trim();
        if (!text) return;
        state.activeMessage.hasCorrespondence = true;
        const sent = document.createElement("article");
        sent.className = "message-card";
        sent.dataset.odId = "message-card-sent-reply";
        sent.innerHTML = `<strong>You</strong><span class="summary">${escapeHtml(text)}</span><time>Just now</time>`;
        $("[data-od-id='message-card-sent-reply']")?.remove();
        $("#replyComposer").before(sent);
        reply.innerHTML = "";
        state.replyAttachments = [];
        $("#attachmentStrip").innerHTML = "";
        $("#formatToolbar").hidden = true;
        $("#formatButton").setAttribute("aria-expanded", "false");
        $("#replyComposer").classList.remove("has-tools");
        $("#replySend").disabled = true;
        $("#autosaveStatus").textContent = "Sent just now";
        showToast("Reply sent");
      }

      const commands = [
        { icon: "square-pen", title: "Compose message", description: "Start a new email", key: "C", run: openCompose },
        { icon: "search", title: "Search mail", description: "Find sender, subject, text, or filters", key: "/", run: openSearch },
        { icon: "clock", title: "Schedule send", description: "Choose a suggested or custom send time", key: "", run: () => showToast("Schedule send") },
        { icon: "signature", title: "Set signatures", description: "Create and format signatures with hyperlinks", key: "S", run: () => showToast("Signature settings") },
        { icon: "archive", title: "Archive current", description: "Move conversation to archive", key: "E", run: archiveCurrent },
        { icon: "bell", title: "Remind me…", description: "Bring this conversation back later", key: "", run: () => showToast("Reminder options") },
        { icon: "circle-x", title: "Unsubscribe", description: "Stop future mail from this sender", key: "", run: () => showToast("Unsubscribe") },
        { icon: "reply", title: "Reply", description: "Focus the inline reply", key: "R", run: focusReply },
        { icon: "star", title: "Toggle star", description: "Star the selected message", key: "S", run: toggleStar },
        { icon: "mail-open", title: "Mark read or unread", description: "Change message status", key: "U", run: toggleRead },
        { icon: "inbox", title: "Go to Inbox", description: "Return to the inbox", key: "G then I", run: () => chooseMailbox("Inbox") },
        { icon: "star", title: "Go to Starred", description: "Open starred conversations", key: "G then S", run: () => chooseMailbox("Starred") },
        { icon: "send", title: "Go to Sent", description: "Open sent messages", key: "G then T", run: () => chooseMailbox("Sent") },
        { icon: "square", title: "Go to Drafts", description: "Open saved drafts", key: "G then D", run: () => chooseMailbox("Drafts") },
        { icon: "archive", title: "Go to Archive", description: "Open archived conversations", key: "G then A", run: () => chooseMailbox("Archive") }
      ];
      let commandIndex = 0;

      function commandMatches() {
        const query = $("#commandSearch").value.trim().toLowerCase();
        return commands.filter((command) => !query || `${command.title} ${command.description}`.toLowerCase().includes(query));
      }

      function renderCommands() {
        const matched = commandMatches();
        commandIndex = Math.min(commandIndex, Math.max(0, matched.length - 1));
        $("#commandResults").innerHTML = matched.length ? matched.map((command, index) => `<button class="command-row${index === commandIndex ? " selected" : ""}" data-index="${index}" data-command="${escapeHtml(command.title)}" data-od-id="command-${command.title.toLowerCase().replace(/[^a-z]+/g, "-")}"><span class="command-icon">${icon(command.icon)}</span><span><span class="command-title">${escapeHtml(command.title)}</span><span class="command-description">${escapeHtml(command.description)}</span></span>${command.key ? keyChip(escapeHtml(command.key)) : "<span></span>"}</button>`).join("") : `<div class="empty-state" style="height:132px">No matching commands.</div>`;
        hydrateIcons();
        $$(".command-row").forEach((row) => {
          row.addEventListener("pointerenter", () => { commandIndex = Number(row.dataset.index); $$(".command-row").forEach((item, index) => item.classList.toggle("selected", index === commandIndex)); });
          row.addEventListener("click", () => runCommand(row.dataset.command));
        });
      }

      function openCommand() {
        $("#composeScrim").hidden = true;
        $("#commandScrim").hidden = false;
        $("#commandSearch").value = "";
        commandIndex = 0;
        renderCommands();
        $("#commandSearch").focus();
      }
      function closeCommand() { $("#commandScrim").hidden = true; }
      function runCommand(title) {
        const command = commands.find((item) => item.title === title);
        closeCommand();
        if (command) command.run();
      }

      function openCompose() {
        closeCommand();
        $("#composeScrim").hidden = false;
        updateComposeSend();
        renderRecipientSuggestions();
        $("#composeTo").focus();
      }
      function closeCompose() {
        $("#composeScrim").hidden = true;
        $("#recipientSuggestions").hidden = true;
      }
      function updateComposeSend() {
        const hasContent = Boolean($("#composeBody").innerText.trim() || state.composeAttachments.length);
        $("#composeSend").disabled = !($("#composeTo").value.trim() && $("#composeSubject").value.trim() && hasContent);
      }
      function composeRecipientMatches() {
        const value = $("#composeTo").value;
        const lastDelimiter = Math.max(value.lastIndexOf(","), value.lastIndexOf(";"));
        const query = value.slice(lastDelimiter + 1).trim().toLowerCase();
        if (!query) return [];
        return recipientDirectory.filter((item) => `${item.name} ${item.email}`.toLowerCase().includes(query)).slice(0, 5);
      }
      function recipientInitials(item) {
        return item.name.split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
      }
      function acceptRecipient(item) {
        const input = $("#composeTo");
        const lastDelimiter = Math.max(input.value.lastIndexOf(","), input.value.lastIndexOf(";"));
        const prefix = lastDelimiter >= 0 ? `${input.value.slice(0, lastDelimiter + 1)} ` : "";
        input.value = `${prefix}${item.name} <${item.email}>`;
        $("#recipientSuggestions").hidden = true;
        updateComposeSend();
        input.focus();
      }
      function renderRecipientSuggestions() {
        const suggestions = $("#recipientSuggestions");
        const matched = composeRecipientMatches();
        state.recipientSelection = Math.min(state.recipientSelection, Math.max(0, matched.length - 1));
        suggestions.hidden = matched.length === 0;
        suggestions.innerHTML = matched.map((item, index) => `<button class="recipient-option${index === state.recipientSelection ? " selected" : ""}" type="button" role="option" aria-selected="${index === state.recipientSelection}" data-email="${escapeHtml(item.email)}"><span class="recipient-avatar">${escapeHtml(recipientInitials(item))}</span><span><span class="recipient-name">${escapeHtml(item.name)}</span><span class="recipient-email">${escapeHtml(item.email)}</span></span><span class="recipient-status">${index === state.recipientSelection ? `${keyChip("Tab")} Complete` : item.previouslyEmailed ? "Previously emailed" : "From Gmail"}</span></button>`).join("");
        const options = [...suggestions.querySelectorAll(".recipient-option")];
        options.forEach((button, index) => {
          button.addEventListener("pointerenter", () => {
            state.recipientSelection = index;
            options.forEach((option, optionIndex) => {
              const selected = optionIndex === state.recipientSelection;
              option.classList.toggle("selected", selected);
              option.setAttribute("aria-selected", String(selected));
              option.querySelector(".recipient-status").innerHTML = selected ? `${keyChip("Tab")} Complete` : matched[optionIndex].previouslyEmailed ? "Previously emailed" : "From Gmail";
            });
          });
          button.addEventListener("mousedown", (event) => { event.preventDefault(); acceptRecipient(matched[index]); });
        });
      }
      function renderComposeAttachments() {
        const count = state.composeAttachments.length;
        $("#composeAttachmentState").textContent = count ? `${count} ${count === 1 ? "attachment" : "attachments"}` : "Draft saved automatically";
        updateComposeSend();
      }
      function sendCompose() {
        if ($("#composeSend").disabled) return;
        const recipient = $("#composeTo").value.trim();
        $("#composeTo").value = "";
        $("#composeSubject").value = "";
        $("#composeBody").innerHTML = "";
        state.composeAttachments = [];
        state.recipientSelection = 0;
        renderComposeAttachments();
        updateComposeSend();
        closeCompose();
        showToast(`Message sent to ${recipient}`);
      }
      function focusReply() {
        if (state.view !== "reader") {
          if (!visibleMessages()[state.selected]) return;
          openMessage(state.selected);
        }
        if (!state.replyOpen) {
          state.replyOpen = true;
          renderReader();
        }
        requestAnimationFrame(() => $("#replyField")?.focus());
      }

      $("#commandTrigger").addEventListener("click", openCommand);
      $("#commandSearch").addEventListener("input", () => { commandIndex = 0; renderCommands(); });
      $("#commandSearch").addEventListener("keydown", (event) => {
        const matched = commandMatches();
        if (event.key === "ArrowDown") { event.preventDefault(); commandIndex = Math.min(commandIndex + 1, matched.length - 1); renderCommands(); }
        if (event.key === "ArrowUp") { event.preventDefault(); commandIndex = Math.max(commandIndex - 1, 0); renderCommands(); }
        if (event.key === "Enter" && matched[commandIndex]) { event.preventDefault(); runCommand(matched[commandIndex].title); }
      });
      $("#commandScrim").addEventListener("mousedown", (event) => { if (event.target === $("#commandScrim")) closeCommand(); });
      $("#composeScrim").addEventListener("mousedown", (event) => { if (event.target === $("#composeScrim")) closeCompose(); });
      $("#composeClose").addEventListener("click", closeCompose);
      $("#composeSend").addEventListener("click", sendCompose);
      [$("#composeTo"), $("#composeSubject"), $("#composeBody")].forEach((field) => field.addEventListener("input", updateComposeSend));
      $("#composeTo").addEventListener("input", () => { state.recipientSelection = 0; renderRecipientSuggestions(); });
      $("#composeTo").addEventListener("focus", renderRecipientSuggestions);
      $("#composeTo").addEventListener("keydown", (event) => {
        const matched = composeRecipientMatches();
        if (!matched.length) return;
        if (event.key === "ArrowDown") { event.preventDefault(); state.recipientSelection = Math.min(state.recipientSelection + 1, matched.length - 1); renderRecipientSuggestions(); }
        if (event.key === "ArrowUp") { event.preventDefault(); state.recipientSelection = Math.max(state.recipientSelection - 1, 0); renderRecipientSuggestions(); }
        if (event.key === "Tab" || event.key === "Enter") { event.preventDefault(); acceptRecipient(matched[state.recipientSelection]); }
      });
      $("#composeAttach").addEventListener("click", () => $("#composeFile").click());
      $("#composeFile").addEventListener("change", (event) => { state.composeAttachments.push(...Array.from(event.target.files)); event.target.value = ""; renderComposeAttachments(); showToast("Attachment added"); });
      $("#composeFormat").addEventListener("mousedown", (event) => { event.preventDefault(); const button = $("#composeFormat"); $("#composeBody").focus(); document.execCommand("bold", false); button.setAttribute("aria-pressed", String(button.getAttribute("aria-pressed") !== "true")); });

      $$(".nav-row").forEach((row) => row.addEventListener("click", () => chooseMailbox(row.dataset.mailbox)));
      document.addEventListener("mousedown", (event) => {
        const popover = $("#morePopover");
        if (popover && !event.target.closest("#moreButton, #morePopover")) { popover.hidden = true; $("#moreButton")?.setAttribute("aria-expanded", "false"); }
        if (!event.target.closest("#composeTo, #recipientSuggestions")) $("#recipientSuggestions").hidden = true;
      });

      document.addEventListener("keydown", (event) => {
        const editable = event.target.matches("input, textarea, [contenteditable='true']");
        if (event.metaKey && event.key.toLowerCase() === "k") { event.preventDefault(); $("#commandScrim").hidden ? openCommand() : closeCommand(); return; }
        if (event.key === "Escape") {
          if (!$("#commandScrim").hidden) closeCommand();
          else if (!$("#composeScrim").hidden) closeCompose();
          else if ($("#morePopover") && !$("#morePopover").hidden) { $("#morePopover").hidden = true; $("#moreButton").setAttribute("aria-expanded", "false"); }
          else if (state.searchOpen || state.query) { state.query = ""; state.searchOpen = false; renderInbox(); }
          return;
        }
        if (event.metaKey && event.key === "Enter") { event.preventDefault(); if (!$("#composeScrim").hidden) sendCompose(); else if (state.view === "reader") sendReply(); return; }
        if (editable || !$("#commandScrim").hidden || !$("#composeScrim").hidden) return;
        const key = event.key.toLowerCase();
        const items = visibleMessages();
        if (key === "j" && state.view === "inbox" && items.length) { event.preventDefault(); state.selected = Math.min(state.selected + 1, items.length - 1); renderInbox(); }
        if (key === "k" && state.view === "inbox" && items.length) { event.preventDefault(); state.selected = Math.max(state.selected - 1, 0); renderInbox(); }
        if (event.key === "Enter" && state.view === "inbox") { event.preventDefault(); openMessage(state.selected); }
        if (key === "e") { event.preventDefault(); archiveCurrent(); }
        if (key === "r") { event.preventDefault(); focusReply(); }
        if (key === "c") { event.preventDefault(); openCompose(); }
        if (event.key === "/") { event.preventDefault(); openSearch(); }
        if (event.key === "Backspace" && state.view === "reader") { event.preventDefault(); state.view = "inbox"; render(); }
      });

      const preview = new URLSearchParams(window.location.search);
      const previewThreadID = preview.get("thread");
      if (previewThreadID) {
        const item = [...messages, ...sentMessages, ...draftMessages].find((message) => message.id === previewThreadID);
        if (item) {
          state.activeMessage = item;
          state.selected = Math.max(0, messages.findIndex((message) => message.id === item.id));
          state.replyOpen = preview.get("reply") === "open" || (preview.get("reply") !== "closed" && Boolean(item.hasCorrespondence));
          state.view = "reader";
        }
      }
      updateNavigation();
      render();
      if (preview.get("overlay") === "command") openCommand();
      if (preview.get("overlay") === "compose") {
        openCompose();
        if (preview.get("to")) {
          $("#composeTo").value = preview.get("to");
          renderRecipientSuggestions();
        }
      }
    })();
  </script>
</body>
</html>
